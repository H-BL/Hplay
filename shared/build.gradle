plugins {
    id 'com.android.library'
}
android {
    namespace = 'com.hpplay.shared'
    compileSdk = 37

    defaultConfig {
        minSdk = 24
        targetSdk = 37

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
        }

        externalNativeBuild {
            ndkBuild {
                arguments 'APP_PLATFORM=android-24'
            }
        }

        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
    }
    ndkVersion = '28.2.13676358'
    externalNativeBuild {
        ndkBuild {
            path = file('src/main/jni/Android.mk')
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }
    testOptions {
        unitTests.returnDefaultValues = true
    }
    lint {
        // minSdk was lowered to 24 (ordinary third-party head units). The pre-existing API 26/28/31
        // call sites are runtime-guarded (the target cars are Android 9 / API 28), so record them in
        // a baseline instead of failing the build; any NEW NewApi error still breaks the build.
        baseline = file("lint-baseline.xml")
    }
}
dependencies {
    implementation libs.androidx.app
    implementation libs.androidx.media3.session
    implementation libs.androidx.media3.container
    implementation libs.bouncycastle
    implementation libs.concentus
    testImplementation libs.junit
}
